name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  windows:
    name: Build Windows artifacts
    runs-on: windows-latest
    env:
      WINDOWS_SIGN_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_BASE64 }}
      WINDOWS_SIGN_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - name: Configure optional trusted signing identity
        shell: pwsh
        run: |
          if ($env:WINDOWS_SIGN_CERTIFICATE_BASE64) {
            $certificate = Join-Path $env:RUNNER_TEMP 'hackers-lair-signing.pfx'
            [IO.File]::WriteAllBytes(
              $certificate,
              [Convert]::FromBase64String($env:WINDOWS_SIGN_CERTIFICATE_BASE64)
            )
            "WINDOWS_SIGN_CERTIFICATE_FILE=$certificate" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Output 'No signing identity configured; producing checksum-published unsigned artifacts.'
          }
      - run: npm run make
      - name: Verify packaged Windows lifecycle
        run: npm run smoke:package
      - name: Verify command-channel installer
        run: npm run smoke:install
      - name: Normalize artifact names
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match package version $version."
          }
          New-Item -ItemType Directory -Path release-assets -Force | Out-Null
          $setup = Get-ChildItem out\make -Recurse -File -Filter "HackersLair-$version-Setup.exe" | Select-Object -First 1
          $archive = Get-ChildItem out\make -Recurse -File -Filter '*.zip' |
            Where-Object FullName -Match '[\\/]zip[\\/]win32[\\/]x64[\\/]' |
            Select-Object -First 1
          $releases = Get-ChildItem out\make -Recurse -File -Filter 'RELEASES' | Select-Object -First 1
          $nupkg = Get-ChildItem out\make -Recurse -File -Filter '*-full.nupkg' | Select-Object -First 1
          if (-not $setup -or -not $archive -or -not $releases -or -not $nupkg) {
            throw 'Electron Forge did not produce the Windows installer, ZIP, RELEASES, and full nupkg.'
          }
          Copy-Item -LiteralPath $setup.FullName -Destination "release-assets\HackersLair-$version-Setup.exe"
          Copy-Item -LiteralPath $archive.FullName -Destination 'release-assets\hackers-lair-win32-x64.zip'
          Copy-Item -LiteralPath $releases.FullName -Destination 'release-assets\RELEASES'
          Copy-Item -LiteralPath $nupkg.FullName -Destination (Join-Path 'release-assets' $nupkg.Name)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-windows
          path: release-assets/*
          if-no-files-found: error

  linux:
    name: Build Linux artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install native package tools
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm xvfb
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run test:coverage
      - run: python -m pip install -r requirements-test.txt
      - run: python -m playwright install --with-deps --only-shell chromium
      - run: npm run test:ui
      - run: npm run test:site-ui
      - run: npm run make
      - name: Verify packaged Linux lifecycle
        env:
          # Forge's raw output cannot carry the root-owned setuid helper used by installed packages.
          LAIR_SMOKE_DISABLE_SANDBOX: "1"
        run: xvfb-run -a npm run smoke:package
      - name: Normalize artifact names
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version." >&2
            exit 1
          fi
          mkdir -p release-assets
          deb="$(find out/make -type f -name '*.deb' -print -quit)"
          rpm="$(find out/make -type f -name '*.rpm' -print -quit)"
          archive="$(find out/make -type f -path '*/zip/linux/x64/*.zip' -print -quit)"
          package_dir="$(find out -maxdepth 1 -mindepth 1 -type d -name '*linux-x64' -print -quit)"
          test -n "$deb" && test -n "$rpm" && test -n "$archive" && test -n "$package_dir"
          cp "$deb" release-assets/hackers-lair_amd64.deb
          cp "$rpm" release-assets/hackers-lair_x86_64.rpm
          cp "$archive" release-assets/hackers-lair-linux-x64.zip
          tar -czf release-assets/hackers-lair-linux-x64.tar.gz -C "$(dirname "$package_dir")" "$(basename "$package_dir")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux
          path: release-assets/*
          if-no-files-found: error

  publish:
    name: Checksums, manifests, and GitHub Release
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.12.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums and package-channel manifests
        run: |
          version="$(node -p "require('./package.json').version")"
          node scripts/finalize-release-assets.js \
            --version "$version" \
            --assets release-assets \
            --manifests generated-manifests
          node scripts/extract-release-notes.js "$version" release-notes.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package-channel-manifests
          path: generated-manifests/
          if-no-files-found: error
      - name: Attest every release artifact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-assets/*
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Hacker's Lair $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
